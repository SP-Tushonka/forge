name: Release

on:
  push:
    # GitHub filter-pattern glob, not a regex: '+' is one-or-more of the preceding
    # character and '.' is literal. Matches 1.0.0 and 12.3.45, not 1.0.0-rc1.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/verification
  CANDIDATE_TAG: verification-candidate:ci

jobs:
  resolve:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.r.outputs.tag }}
      sha: ${{ steps.r.outputs.sha }}
      tags: ${{ steps.r.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate the release tag
        id: r
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::This workflow must run from a tag. Re-dispatch with a release tag selected as the ref."
            exit 1
          fi

          TAG="${{ github.ref_name }}"

          printf '%s' "$TAG" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::Refusing tag '$TAG': must be major.minor.patch, e.g. 1.2.0"
            exit 1
          }

          SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"

          git fetch --no-tags origin master
          git merge-base --is-ancestor "$SHA" FETCH_HEAD || {
            echo "::error::$TAG ($SHA) is not an ancestor of master. Only master is releasable."
            exit 1
          }

          IMAGE="$(printf '%s/%s' "$REGISTRY" "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tags=$IMAGE:release,$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG ($SHA)"

  # Runs against the tagged commit, not whatever master tip happens to be.
  tests:
    needs: resolve
    uses: ./.github/workflows/tests.yaml
    secrets: inherit

  # Before the deploy, so the image the new code expects exists by the time it lands.
  publish-image:
    runs-on: ubuntu-latest

    needs: [resolve, tests]

    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: docker/verification
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.CANDIDATE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Check the image and the host agree on the check suite
        run: |
          CONTAINER_JSON="$(docker run --rm --network=none "$CANDIDATE_TAG")"
          echo "Container reported: $CONTAINER_JSON"

          CONTAINER_CHECKS="$(printf '%s' "$CONTAINER_JSON" | sed -n 's/.*"checks_version":"\([^"]*\)".*/\1/p')"
          HOST_CHECKS="$(sed -n "s/.*LATEST_CHECKS_VERSION = '\([^']*\)'.*/\1/p" app/Jobs/RunVerificationJob.php)"

          if [ -z "$CONTAINER_CHECKS" ]; then
            echo "::error::Image reported no checks_version. It may not be emitting the expected JSON contract."
            exit 1
          fi

          if [ "$CONTAINER_CHECKS" != "$HOST_CHECKS" ]; then
            echo "::error::Check suite mismatch: image reports '$CONTAINER_CHECKS', host expects '$HOST_CHECKS'. Bump CheckRegistry.ChecksVersion and RunVerificationJob::LATEST_CHECKS_VERSION together."
            exit 1
          fi

          echo "Check suite $CONTAINER_CHECKS agrees with the host."

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: docker/verification
          platforms: linux/amd64
          push: true
          tags: ${{ needs.resolve.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
          cache-from: type=gha

  deploy:
    runs-on: ubuntu-latest

    needs: [resolve, tests, publish-image]

    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # the ssh connection f* up the spaces so we clean them up
          host="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          user="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          script="$(printf '%s' "$DEPLOY_SCRIPT" | tr -d '[:space:]')"

          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o ConnectTimeout=15 "$user@$host" "$script" "$RELEASE_TAG"
